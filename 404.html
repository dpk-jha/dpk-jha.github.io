<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="robots" content="noindex">
    <meta name="description" content="Page not found — Deepak Jha">
    <title>404 | Deepak Jha</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Absolute paths on purpose: GitHub Pages serves this file at any URL depth. -->
    <link rel="stylesheet" href="/shared/fonts.css?v=996f89dfb4">
    <link rel="stylesheet" href="/shared/site.css?v=d162a81282">
    <!-- Fonts are self-hosted (@font-face in the stylesheet). Preload only the two used for first paint, after the CSS so they never delay it. -->
    <link rel="preload" href="/shared/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/shared/fonts/playfair-var-latin.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        .not-found { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; overflow: hidden; }
        .not-found::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(50% 50% at 50% 40%, rgba(242, 179, 90, 0.08), transparent 70%); }
        .not-found > * { position: relative; }
        .not-found .big { font-family: var(--serif); font-weight: 700; font-size: clamp(5rem, 15vw, 10rem); color: rgba(255, 255, 255, 0.08); line-height: 1; font-variant-numeric: lining-nums; margin-bottom: 1.25rem; }
        .not-found h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); color: var(--fg); margin-bottom: 0.75rem; }
        .not-found .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        .not-found p { font-size: 1.125rem; color: var(--fg-2); margin-bottom: 2.5rem; }
    </style>
    <script src="/shared/analytics.js?v=5f977a5af9" defer></script>
</head>
<body>
    <main class="not-found">
        <p class="big" aria-hidden="true">404</p>
        <h1>Page not found</h1>
        <p>This page doesn&rsquo;t exist, or it has moved.</p>
        <div class="links">
            <a href="/" class="btn btn-accent">Home</a>
            <a href="/projects" class="btn btn-ghost">Projects</a>
            <a href="/resume/" class="btn btn-ghost">Resume</a>
        </div>
    </main>
</body>
</html>
